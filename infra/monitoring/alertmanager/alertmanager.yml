# Where firing alerts are sent. The default receiver only keeps them visible in the Alertmanager UI
# (http://127.0.0.1:9093). To notify someone, add a receiver, for example:
#
#   receivers:
#     - name: team
#       slack_configs:
#         - api_url: https://hooks.slack.com/services/...   # keep the real URL out of git
#           channel: '#dispute-portal-alerts'
#
# and point the route at it with "receiver: team".
route:
  receiver: default
  group_by: [alertname, severity]
  group_wait: 30s
  repeat_interval: 4h

receivers:
  - name: default
