# Scrapes the API over the internal Docker network. The backend publishes no host port.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: dispute-portal
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
