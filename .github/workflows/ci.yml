name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 25)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test

  stack-api-tests:
    name: Containers and API tests
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create .env with generated secrets
        run: ./scripts/bootstrap-env.sh
      - name: Build API jar and web bundle (images package these)
        run: make build
      - run: docker compose up -d --build --wait
      - name: Bruno API tests (dev stack)
        working-directory: bruno
        run: npx --yes @usebruno/cli@latest run --env Docker -r
      - name: Stop dev stack
        run: docker compose down -v
      - name: Start SSO stack
        run: docker compose -f docker-compose.yml -f docker-compose.sso.yml up -d --build --wait
      - name: Bruno API tests (real OIDC tokens)
        working-directory: bruno
        run: npx --yes @usebruno/cli@latest run --env Sso -r
      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.sso.yml logs --no-color

  security-scan:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (dependencies, misconfigurations, secrets)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          scanners: vuln,secret,misconfig
