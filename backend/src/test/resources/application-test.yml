spring:
  datasource:
    url: jdbc:h2:mem:disputes;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

app:
  security:
    jwt-secret: test-only-secret-key-that-is-long-enough-for-hs256
  cors:
    allowed-origins: http://localhost:5173
  rate-limit:
    # Generous in tests so the functional tests are not throttled. RateLimitFilterTest covers the limits.
    api-per-minute: 100000
    dispute-submit-per-minute: 100000
