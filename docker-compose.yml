services:
  db:
    image: postgres:16-alpine
    mem_limit: 512m
    environment:
      POSTGRES_DB: dispute_portal
      POSTGRES_USER: dispute
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispute -d dispute_portal"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    mem_limit: 768m
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      DB_URL: jdbc:postgresql://db:5432/dispute_portal
      DB_USER: dispute
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8180/realms/dispute-portal}
      OIDC_JWK_SET_URI: ${OIDC_JWK_SET_URI:-http://keycloak:8080/realms/dispute-portal/protocol/openid-connect/certs}
      APP_AUDIENCE: ${APP_AUDIENCE:-dispute-portal-api}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5173}
      TRUST_FORWARDED_FOR: "true"
      JWT_SECRET: ${JWT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    ports:
      - "8080:8080"
    build:
      context: ./frontend
    mem_limit: 128m
    environment:
      OIDC_ORIGIN: ${OIDC_ORIGIN:-http://localhost:8180}
    depends_on:
      backend:
        condition: service_healthy

  # ---- Monitoring (opt-in: make up-monitoring) -------------------------------------------------
  # Grafana UI on http://127.0.0.1:3000. Prometheus and Loki are reachable only inside the Compose network,
  # except Prometheus on 127.0.0.1:9090 for troubleshooting.
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./infra/monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - backend

  loki:
    profiles: ["monitoring"]
    image: grafana/loki:3.1.1
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./infra/monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  alloy:
    # Reads container logs through the Docker socket (read-only) and forwards them to Loki.
    profiles: ["monitoring"]
    image: grafana/alloy:v1.3.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./infra/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  postgres-exporter:
    # Database metrics (connections, size, commits) for the Database panels.
    profiles: ["monitoring"]
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://dispute:${DB_PASSWORD}@db:5432/dispute_portal?sslmode=disable
    depends_on:
      - db

  alertmanager:
    # Shows firing alerts at http://127.0.0.1:9093. Add email, Slack or Teams in infra/monitoring/alertmanager/alertmanager.yml.
    profiles: ["monitoring"]
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./infra/monitoring/alertmanager:/etc/alertmanager:ro
    ports:
      - "127.0.0.1:9093:9093"

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  db-data:
  prometheus-data:
  loki-data:
  grafana-data:
